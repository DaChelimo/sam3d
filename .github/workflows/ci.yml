name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Run the unit suite on all three desktop targets. Machine-specific tests self-skip in CI:
  #  - Dcm4cheLoaderTest integration tests guard on the sample DICOM dir (absent here) via Assume.
  #  - ScreenshotGenTest only runs when SAM3D_SCREENSHOTS=true.
  #  - PromptingEndToEndValidationTest writes under build/ and is self-contained, so it runs everywhere.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run unit tests
        shell: bash
        run: ./gradlew :composeApp:jvmTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: composeApp/build/reports/tests/
          if-no-files-found: ignore

  # Build a native distribution per OS, but only on a version tag (v*). Codesigning/notarization is
  # intentionally not wired here yet — see docs/PACKAGING.md (deferred to release prep).
  package:
    name: Package (${{ matrix.os }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            task: packageDmg
            path: composeApp/build/compose/binaries/main/dmg/*.dmg
          - os: windows-latest
            task: packageMsi
            path: composeApp/build/compose/binaries/main/msi/*.msi
          - os: ubuntu-latest
            task: packageDeb
            path: composeApp/build/compose/binaries/main/deb/*.deb
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build distribution
        shell: bash
        run: ./gradlew :composeApp:${{ matrix.task }} --stacktrace

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: sam3d-${{ matrix.os }}
          path: ${{ matrix.path }}
          if-no-files-found: error
