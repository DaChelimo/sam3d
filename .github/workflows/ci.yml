name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]
  # Manual trigger so the portable Windows zip can be built on demand
  # (e.g. for lab testing) without cutting a version tag.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Run the unit suite on all three desktop targets. Machine-specific tests self-skip in CI:
  #  - Dcm4cheLoaderTest integration tests guard on the sample DICOM dir (absent here) via Assume.
  #  - ScreenshotGenTest only runs when SAM3D_SCREENSHOTS=true.
  #  - PromptingEndToEndValidationTest writes under build/ and is self-contained, so it runs everywhere.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run unit tests
        shell: bash
        run: ./gradlew :composeApp:jvmTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: composeApp/build/reports/tests/
          if-no-files-found: ignore

  # Build a native distribution per OS, but only on a version tag (v*).
  # Each installer bundles a full JRE — users need no Java installed.
  # Codesigning/notarization is intentionally not wired here yet — see docs/PACKAGING.md.
  package:
    name: Package (${{ matrix.os }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            task: packageDmg
            path: composeApp/build/compose/binaries/main/dmg/*.dmg
            artifact: sam3d-macos
          - os: windows-latest
            task: packageMsi
            path: composeApp/build/compose/binaries/main/msi/*.msi
            artifact: sam3d-windows
          - os: ubuntu-latest
            task: packageDeb
            path: composeApp/build/compose/binaries/main/deb/*.deb
            artifact: sam3d-linux
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build distribution
        shell: bash
        run: ./gradlew :composeApp:${{ matrix.task }} --stacktrace

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  # Portable Windows build: the unpacked app image (createDistributable), zipped.
  # Unlike the .msi this needs NO installer and NO admin rights — the lab user
  # unzips the folder and double-clicks SAM3D.exe. The JRE is bundled inside
  # SAM3D/runtime/, so no system-wide Java is required or registered.
  # Runs on a tag (published with the release) or on manual workflow_dispatch.
  package-portable-windows:
    name: Package portable Windows (no installer)
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build unpacked app image
        shell: bash
        run: ./gradlew :composeApp:createDistributable --stacktrace

      - name: Zip app image
        shell: pwsh
        # Compress the SAM3D folder itself so unzipping yields SAM3D/SAM3D.exe.
        run: Compress-Archive -Path composeApp/build/compose/binaries/main/app/SAM3D -DestinationPath SAM3D-windows-portable.zip

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: sam3d-windows-portable
          path: SAM3D-windows-portable.zip
          if-no-files-found: error

  # Collect all three installers and publish them as a GitHub Release.
  # Users download the file for their OS — no Java installation required.
  release:
    name: Publish GitHub Release
    needs: [package, package-portable-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS installer
        uses: actions/download-artifact@v4
        with:
          name: sam3d-macos
          path: release/

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: sam3d-windows
          path: release/

      - name: Download Linux installer
        uses: actions/download-artifact@v4
        with:
          name: sam3d-linux
          path: release/

      - name: Download portable Windows zip
        uses: actions/download-artifact@v4
        with:
          name: sam3d-windows-portable
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## Installation — no Java required

            Each installer bundles its own JRE. Download the file for your OS, install, and run.

            | Platform | File | Notes |
            |----------|------|-------|
            | macOS    | `.dmg` | Open the DMG and drag SAM3D to Applications |
            | Windows  | `.msi` | Run the installer wizard (needs admin rights) |
            | Windows (portable) | `SAM3D-windows-portable.zip` | **No installer, no admin** — unzip and run `SAM3D\SAM3D.exe` |
            | Linux    | `.deb` | `sudo dpkg -i sam3d_*.deb` |

            **Python is still required** for the pipeline engine (`../SAM3D-GCODE/`).
            See the [README](https://github.com/${{ github.repository }}/blob/main/README.md) for setup.
